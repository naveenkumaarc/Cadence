name: Cadence Android build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cadence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: default
          - api: 35
            target: google_apis
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 35
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build and check unsigned release and test APKs
        run: ./gradlew --no-daemon -PcadenceUnsigned :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Native Android tests
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash tools/run-native-checks.sh
      - name: Save APKs and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cadence-2.0.1-api-${{ matrix.api }}
          retention-days: 7
          path: |
            app/build/outputs/apk/
            app/build/reports/
            core/build/test-results/
