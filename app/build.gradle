import app.cadence.build.UrlCodecVisitor
import com.android.build.api.instrumentation.InstrumentationScope

plugins { id 'com.android.application' }
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(UrlCodecVisitor.class, InstrumentationScope.ALL) {}
    }
}
android {
    namespace 'app.cadence.music'
    compileSdk 35
    defaultConfig {
        applicationId 'app.cadence.player'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.1'
        def googleClientId = providers.gradleProperty('cadenceGoogleClientId').orElse('823603474331-q4ng1jpvtftt9bjpadfei0go1d6ipeej.apps.googleusercontent.com').get()
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"' + googleClientId.replace('"', '') + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('CADENCE_KEYSTORE') ?: '../../signing/cadence-release.jks')
            storePassword System.getenv('CADENCE_STORE_PASSWORD')
            keyAlias 'cadence'
            keyPassword System.getenv('CADENCE_KEY_PASSWORD') ?: System.getenv('CADENCE_STORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            if (!project.hasProperty('cadenceUnsigned')) signingConfig signingConfigs.release
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildFeatures { buildConfig true }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'] }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation project(':core')
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
